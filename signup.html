<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTalk - Create Account</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================
   GlobeTalk Premium Sign Up
========================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Nunito',sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:
linear-gradient(135deg,#f9f4ff,#f6ecff,#fff0f8);

}

.background{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

overflow:hidden;

z-index:-1;

}

.blob{

position:absolute;

border-radius:50%;

filter:blur(80px);

animation:float 10s infinite alternate;

}

.blob1{

width:320px;
height:320px;

background:#b18ae9;

left:-120px;
top:-70px;

opacity:.35;

}

.blob2{

width:280px;
height:280px;

background:#ffb3dd;

right:-70px;
bottom:-70px;

opacity:.35;

animation-delay:3s;

}

@keyframes float{

from{

transform:translateY(0px);

}

to{

transform:translateY(-45px);

}

}

.signup-card{

width:460px;

max-width:94%;

background:rgba(255,255,255,.82);

backdrop-filter:blur(18px);

padding:40px;

border-radius:32px;

box-shadow:
0 25px 70px rgba(0,0,0,.12);

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:none;

}

}

.logo{

width:95px;
height:95px;

margin:auto;

display:flex;
align-items:center;
justify-content:center;

font-size:46px;

border-radius:50%;

background:
linear-gradient(135deg,#8b5cf6,#b18ae9);

color:white;

box-shadow:
0 15px 35px rgba(139,92,246,.35);

margin-bottom:20px;

}

h1{

font-family:'Baloo 2';

text-align:center;

font-size:38px;

color:#7c4de0;

}

.subtitle{

text-align:center;

color:#777;

margin-top:6px;

margin-bottom:30px;

}

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

font-weight:700;

margin-bottom:8px;

color:#555;

}

.input-group input{

width:100%;

padding:15px 18px;

border:none;

outline:none;

background:#f6f2fd;

border-radius:16px;

font-size:15px;

transition:.25s;

}

.input-group input:focus{

box-shadow:
0 0 0 3px rgba(139,92,246,.25);

}

.password-wrapper{

position:relative;

}

.password-wrapper input{

padding-right:60px;

}

.togglePassword,
.toggleConfirm{

position:absolute;

right:10px;

top:50%;

transform:translateY(-50%);

width:42px;

height:42px;

border:none;

background:none;

cursor:pointer;

font-size:20px;

border-radius:12px;

transition:.2s;

}

.togglePassword:hover,
.toggleConfirm:hover{

background:#ede5ff;

}

#strength{

font-size:13px;

font-weight:700;

margin-bottom:18px;

}

#signupBtn{

width:100%;

padding:16px;

border:none;

border-radius:18px;

font-size:17px;

font-weight:800;

cursor:pointer;

background:
linear-gradient(135deg,#8b5cf6,#b18ae9);

color:white;

transition:.25s;

}

#signupBtn:hover{

transform:translateY(-2px);

box-shadow:
0 12px 30px rgba(139,92,246,.35);

}

.divider{

display:flex;

align-items:center;

margin:25px 0;

}

.divider::before,
.divider::after{

content:"";

flex:1;

height:1px;

background:#ddd;

}

.divider span{

padding:0 15px;

font-size:13px;

font-weight:700;

color:#999;

}

#googleBtn{

width:100%;

padding:15px;

border:none;

border-radius:18px;

background:white;

display:flex;

justify-content:center;

align-items:center;

gap:10px;

cursor:pointer;

font-size:15px;

font-weight:700;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

transition:.25s;

}

#googleBtn:hover{

transform:translateY(-2px);

}

.signin{

margin-top:25px;

text-align:center;

font-size:15px;

}

.signin a{

text-decoration:none;

font-weight:800;

color:#8b5cf6;

}

.loader{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:rgba(255,255,255,.88);

z-index:9999;

}

.hidden{

display:none;

}

.spinner{

width:70px;
height:70px;

border:6px solid #eee;

border-top:6px solid #8b5cf6;

border-radius:50%;

animation:spin .8s linear infinite;

margin-bottom:20px;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

.loader p{

font-weight:700;

color:#7c4de0;

}

@media(max-width:500px){

.signup-card{

padding:28px;

border-radius:24px;

}

.logo{

width:80px;
height:80px;

font-size:40px;

}

h1{

font-size:32px;

}

}
    </style>

</head>



<body>

    <div class="background">

        <div class="blob blob1"></div>
        <div class="blob blob2"></div>

    </div>

    <div class="signup-card">

        <div class="logo">

            🌍

        </div>

        <h1>Create Account</h1>

        <p class="subtitle">

            Join GlobeTalk and start learning today!

        </p>

        <form id="signupForm">

            <div class="input-group">

                <label>Full Name</label>

                <input type="text" id="name" placeholder="Your Name" required>

            </div>

            <div class="input-group">

                <label>Email</label>

                <input type="email" id="email" placeholder="Enter your email" required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-wrapper">

                    <input type="password" id="password" placeholder="Minimum 6 characters" required>

                    <button type="button" class="togglePassword">

                        👁️

                    </button>

                </div>

            </div>

            <div class="input-group">

                <label>Confirm Password</label>

                <div class="password-wrapper">

                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                    <button type="button" class="toggleConfirm">

                        👁️

                    </button>

                </div>

            </div>

            <div id="strength">

                Password Strength

            </div>

            <button type="submit" id="signupBtn">

                Create Account

            </button>

            <div class="divider">

                <span>OR</span>

            </div>

            <button type="button" id="googleBtn">

                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22">

                Continue with Google

            </button>

            <div class="signin">

                Already have an account?

                <a href="signin.html">

                    Sign In

                </a>

            </div>

        </form>

    </div>

    <div id="loader" class="loader hidden">

        <div class="spinner"></div>

        <p>

            Creating your account...

        </p>

    </div>
    <script type="module">

        import {

            register,
            googleLogin

        } from "./firebase.js";

        const form = document.getElementById("signupForm");

        const loader = document.getElementById("loader");

        const password = document.getElementById("password");

        const confirm = document.getElementById("confirmPassword");

        document.querySelector(".togglePassword").onclick = () => {

            password.type = password.type === "password" ? "text" : "password";

        };

        document.querySelector(".toggleConfirm").onclick = () => {

            confirm.type = confirm.type === "password" ? "text" : "password";

        };

        password.addEventListener("input", () => {

            const s = document.getElementById("strength");

            const value = password.value;

            if (value.length < 6) {

                s.innerHTML = "Weak Password";

                s.style.color = "#ff3b30";

            } else if (value.length < 10) {

                s.innerHTML = "Medium Password";

                s.style.color = "#ff9500";

            } else {

                s.innerHTML = "Strong Password";

                s.style.color = "#34c759";

            }

        });

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            if (password.value !== confirm.value) {

                alert("Passwords do not match.");

                return;

            }

            loader.classList.remove("hidden");

            try {

                await register(

                    name.value,

                    email.value,

                    password.value

                );

                alert("Account created successfully!");

                window.location.href = "signin.html";

            } catch (error) {

                loader.classList.add("hidden");

                alert(error.message);

            }

        });

        googleBtn.onclick = async () => {

            try {

                await googleLogin();

                window.location.href = "index.html";

            } catch (error) {

                alert(error.message);

            }

        };

    </script>
    
    </body>


</html>
