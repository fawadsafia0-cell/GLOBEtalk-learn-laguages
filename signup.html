<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTalk - Create Account</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {

            background:
                radial-gradient(circle at top left, #EAD9FF 0%, transparent 40%),
                radial-gradient(circle at bottom right, #FFE4F2 0%, transparent 40%),
                #F9F6FC;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;

        }

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .45;
            animation: float 12s infinite alternate;
        }

        .blob:nth-child(1) {
            width: 260px;
            height: 260px;
            background: #B18AE9;
            left: -80px;
            top: -60px;
        }

        .blob:nth-child(2) {
            width: 220px;
            height: 220px;
            background: #FFD2E8;
            right: -60px;
            bottom: -50px;
            animation-delay: 3s;
        }

        @keyframes float {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-40px);
            }

        }

        .card {

            width: 400px;
            max-width: 92%;
            background: rgba(255, 255, 255, .78);
            backdrop-filter: blur(18px);
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .12);
            position: relative;
            z-index: 5;

        }

        .logo {

            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            background: #B7A4E0;
            box-shadow: 0 10px 25px rgba(183, 164, 224, .5);

        }

        h1 {

            font-family: 'Baloo 2';
            text-align: center;
            font-size: 35px;
            margin-top: 15px;
            color: #7C5CD1;

        }

        .subtitle {

            text-align: center;
            color: #777;
            margin-bottom: 25px;

        }

        label {

            font-weight: 700;
            font-size: 14px;
            color: #555;

        }

        input {

            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 14px;
            background: #F4F1FA;
            margin-top: 8px;
            margin-bottom: 18px;
            font-size: 15px;
            transition: .3s;

        }

        input:focus {

            box-shadow: 0 0 0 3px rgba(183, 164, 224, .35);

        }

        .signup {

            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #B18AE9, #9C6DFF);
            color: white;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: .25s;

        }

        .signup:hover {

            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(156, 109, 255, .35);

        }

        .or {

            text-align: center;
            margin: 22px 0;
            font-weight: 700;
            color: #888;

        }

        .google {

            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);

        }

        .bottom {

            text-align: center;
            margin-top: 25px;

        }

        .bottom a {

            text-decoration: none;
            font-weight: 800;
            color: #8D6ED7;

        }

        footer {

            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;

        }
    </style>

</head>

<body>

    <div class="background">
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="card">

        <div class="logo">
            🌍
        </div>

        <h1>GlobeTalk</h1>

        <div class="subtitle">
            Create your free account
        </div>

        <label>Full Name</label>

        <input type="text" id="name" placeholder="Your Name">

        <label>Email</label>

        <input type="email" id="email" placeholder="Enter your email">

        <label>Password</label>

        <input type="password" id="password" placeholder="Minimum 6 characters">

        <label>Confirm Password</label>

        <input type="password" id="confirm" placeholder="Confirm your password">

        <button class="signup" onclick="register()">

            Create Account

        </button>

        <div class="or">
            OR
        </div>

        <button class="google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Continue with Google
        </button>

        <div class="bottom">

            Already have an account?

            <a href="signin.html">

                Sign In

            </a>

        </div>

        <footer>

            By creating an account you agree to GlobeTalk's Terms & Privacy Policy.

        </footer>

    </div>

    <script>

        function register() {

            const name = document.getElementById("name").value.trim();

            const email = document.getElementById("email").value.trim();

            const password = document.getElementById("password").value;

            const confirm = document.getElementById("confirm").value;

            if (name == "") {

                alert("Please enter your name.");

                return;

            }

            if (email == "") {

                alert("Please enter your email.");

                return;

            }

            if (password.length < 6) {

                alert("Password must be at least 6 characters.");

                return;

            }

            if (password !== confirm) {

                alert("Passwords do not match.");

                return;

            }

            /*
            
            Firebase Create User Code
            will be added later.
            
            */

            alert("Account created successfully!");

            window.location.href = "signin.html";

        }

    </script>

</body>

</html>
