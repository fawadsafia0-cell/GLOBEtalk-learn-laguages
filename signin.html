<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTalk - Sign In</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">

<style>/* ===========================
   GlobeTalk Premium Sign In
=========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Nunito',sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:
linear-gradient(135deg,#f9f5ff,#f4eaff,#ffeef8);

}

.background{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

overflow:hidden;

z-index:-1;

}

.blob{

position:absolute;

border-radius:50%;

filter:blur(70px);

animation:float 8s infinite alternate;

}

.blob1{

width:320px;
height:320px;

background:#b084ff;

left:-100px;
top:-80px;

opacity:.35;

}

.blob2{

width:260px;
height:260px;

background:#ff9fd2;

right:-60px;
bottom:-60px;

opacity:.30;

animation-delay:2s;

}

@keyframes float{

from{

transform:translateY(0px);

}

to{

transform:translateY(-45px);

}

}

.login-card{

width:430px;

max-width:94%;

padding:40px;

border-radius:32px;

background:rgba(255,255,255,.82);

backdrop-filter:blur(18px);

box-shadow:
0 25px 70px rgba(0,0,0,.12);

animation:fadeUp .8s;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:none;

}

}

.logo{

width:95px;
height:95px;

margin:auto;

display:flex;
align-items:center;
justify-content:center;

font-size:48px;

border-radius:50%;

background:
linear-gradient(135deg,#9c6dff,#b18ae9);

color:white;

box-shadow:
0 15px 35px rgba(156,109,255,.35);

margin-bottom:20px;

}

h1{

text-align:center;

font-size:40px;

font-family:'Baloo 2';

color:#7b4fe0;

}

.subtitle{

text-align:center;

margin-top:5px;

color:#777;

margin-bottom:30px;

}

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

font-weight:700;

margin-bottom:8px;

color:#555;

}

.input-group input{

width:100%;

padding:15px 18px;

border:none;

outline:none;

background:#f6f2fd;

border-radius:16px;

font-size:15px;

transition:.3s;

}

.input-group input:focus{

box-shadow:
0 0 0 3px rgba(156,109,255,.25);

}

.password-wrapper{

position:relative;

}

.password-wrapper input{

padding-right:60px;

}

#togglePassword{

position:absolute;

right:10px;

top:50%;

transform:translateY(-50%);

width:42px;

height:42px;

border:none;

border-radius:12px;

background:none;

cursor:pointer;

font-size:20px;

transition:.2s;

}

#togglePassword:hover{

background:#ede4ff;

}

.row{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

font-size:14px;

}

.row a{

color:#8b5cf6;

text-decoration:none;

font-weight:700;

}

.remember{

display:flex;

align-items:center;

gap:8px;

}

#loginBtn{

width:100%;

padding:16px;

border:none;

border-radius:18px;

font-size:17px;

font-weight:800;

cursor:pointer;

background:
linear-gradient(135deg,#8b5cf6,#b18ae9);

color:white;

transition:.25s;

}

#loginBtn:hover{

transform:translateY(-2px);

box-shadow:
0 12px 30px rgba(139,92,246,.35);

}

.divider{

display:flex;

align-items:center;

margin:25px 0;

}

.divider::before,
.divider::after{

content:"";

flex:1;

height:1px;

background:#ddd;

}

.divider span{

padding:0 15px;

font-size:13px;

color:#999;

font-weight:700;

}

#googleBtn{

width:100%;

padding:15px;

border:none;

border-radius:18px;

background:white;

cursor:pointer;

display:flex;

justify-content:center;

align-items:center;

gap:10px;

font-size:15px;

font-weight:700;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

transition:.25s;

}

#googleBtn:hover{

transform:translateY(-2px);

}

.signup{

margin-top:25px;

text-align:center;

font-size:15px;

}

.signup a{

font-weight:800;

text-decoration:none;

color:#8b5cf6;

}

.loader{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(255,255,255,.85);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

z-index:9999;

}

.hidden{

display:none;

}

.spinner{

width:70px;
height:70px;

border:6px solid #eee;

border-top:6px solid #8b5cf6;

border-radius:50%;

animation:spin .8s linear infinite;

margin-bottom:20px;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

.loader p{

font-weight:700;

color:#7b4fe0;

}

@media(max-width:500px){

.login-card{

padding:28px;

border-radius:24px;

}

.logo{

width:80px;
height:80px;

font-size:40px;

}

h1{

font-size:32px;

}

}
</style>
</head>

<body>

    <div class="background">

        <div class="blob blob1"></div>
        <div class="blob blob2"></div>

    </div>

    <div class="login-card">

        <div class="logo">

            🌍

        </div>

        <h1>GlobeTalk</h1>

        <p class="subtitle">

            Learn Languages The Fun Way

        </p>

        <form id="loginForm">

            <div class="input-group">

                <label>Email</label>

                <input type="email" id="email" placeholder="Enter your email" required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-wrapper">

                    <input type="password" id="password" placeholder="Enter your password" required>

                    <button type="button" id="togglePassword">

                        👁️

                    </button>

                </div>

            </div>

            <div class="row">

                <label class="remember">

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="forgot.html">

                    Forgot Password?

                </a>

            </div>

            <button type="submit" id="loginBtn">

                Sign In

            </button>

            <div class="divider">

                <span>OR</span>

            </div>

            <button type="button" id="googleBtn">

                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22">

                Continue with Google

            </button>

            <div class="signup">

                Don't have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </div>

        </form>

    </div>

    <div id="loader" class="loader hidden">

        <div class="spinner"></div>

        <p>Signing you in...</p>

    </div><script type="module">

        import {

            login,
            googleLogin

        } from "./firebase.js";

        const form = document.getElementById("loginForm");

        const loader = document.getElementById("loader");

        const toggle = document.getElementById("togglePassword");

        const password = document.getElementById("password");

        toggle.onclick = () => {

            if (password.type === "password") {

                password.type = "text";

                toggle.innerHTML = "🙈";

            } else {

                password.type = "password";

                toggle.innerHTML = "👁️";

            }

        };

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            loader.classList.remove("hidden");

            try {

                await login(

                    email.value,

                    password.value

                );

                window.location.href = "index.html";

            } catch (error) {

                loader.classList.add("hidden");

                alert(error.message);

            }

        });

        googleBtn.onclick = async () => {

            try {

                await googleLogin();

                window.location.href = "index.html";

            } catch (error) {

                alert(error.message);

            }

        };

    </script>
    
    </body>
