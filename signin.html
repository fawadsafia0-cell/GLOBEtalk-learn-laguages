<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTalk - Sign In</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {

            background:
                radial-gradient(circle at top left, #EAD9FF 0%, transparent 40%),
                radial-gradient(circle at bottom right, #FFE4F2 0%, transparent 40%),
                #F9F6FC;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;

        }

        .background {

            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;

        }

        .blob {

            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .45;
            animation: float 12s infinite alternate;

        }

        .blob:nth-child(1) {

            width: 260px;
            height: 260px;
            background: #B18AE9;
            left: -80px;
            top: -60px;

        }

        .blob:nth-child(2) {

            width: 220px;
            height: 220px;
            background: #FFD2E8;
            right: -60px;
            bottom: -50px;
            animation-delay: 3s;

        }

        @keyframes float {

            from {
                transform: translateY(0px);
            }

            to {
                transform: translateY(-40px);
            }

        }

        .card {

            width: 380px;
            max-width: 92%;
            background: rgba(255, 255, 255, .75);
            backdrop-filter: blur(18px);
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .12);
            position: relative;
            z-index: 10;

        }

        .logo {

            width: 90px;
            height: 90px;
            margin: auto;
            display: block;
            border-radius: 50%;
            background: #B7A4E0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 8px 25px rgba(183, 164, 224, .5);

        }

        h1 {

            font-family: 'Baloo 2';
            font-size: 38px;
            text-align: center;
            margin-top: 15px;
            color: #7C5CD1;

        }

        .subtitle {

            text-align: center;
            color: #777;
            margin-bottom: 28px;

        }

        label {

            font-size: 14px;
            font-weight: 700;
            color: #555;

        }

        input {

            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 14px;
            margin-top: 8px;
            margin-bottom: 18px;
            background: #F4F1FA;
            font-size: 15px;
            transition: .3s;

        }

        input:focus {

            box-shadow: 0 0 0 3px rgba(183, 164, 224, .35);

        }

        .options {

            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;

        }

        .options a {

            text-decoration: none;
            color: #8D6ED7;
            font-weight: 700;

        }

        .login {

            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #B18AE9, #9C6DFF);
            color: white;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: .25s;

        }

        .login:hover {

            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(156, 109, 255, .35);

        }

        .or {

            text-align: center;
            margin: 22px 0;
            color: #888;
            font-weight: 700;

        }

        .google {

            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);

        }

        .bottom {

            margin-top: 28px;
            text-align: center;
            font-size: 15px;

        }

        .bottom a {

            text-decoration: none;
            color: #8D6ED7;
            font-weight: 800;

        }

        footer {

            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #999;

        }
        
        .password-box{

position:relative;

}

.password-box input{

padding-right:55px;

}

.toggle-password{

position:absolute;

right:12px;

top:50%;

transform:translateY(-50%);

background:none;

border:none;

cursor:pointer;

font-size:20px;

}
    </style>

</head>

<body>
    <div class="password-box">
    
        <input type="password" id="password" placeholder="Enter your password">
    
        <button type="button" class="toggle-password" onclick="togglePassword()">
    
            👁️
    
        </button>
    
    </div>

    <div class="background">
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="card">

        <div class="logo">
            🌍
        </div>

        <h1>GlobeTalk</h1>

        <div class="subtitle">
            Learn Languages The Fun Way
        </div>

        <label>Email</label>

        <input type="email" id="email" placeholder="Enter your email">

        <label>Password</label>

        <input type="password" id="password" placeholder="Enter your password">

        <div class="options">

            <label>

                <input type="checkbox" style="width:auto;margin:0 5px 0 0;">

                Remember Me

            </label>

            <a href="forgot.html">
                Forgot Password?
            </a>

        </div>

        <button class="login" onclick="login()">

            Sign In

        </button>

        <div class="or">
            OR
        </div>

        <button class="google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Continue with Google
        </button>

        <div class="bottom">

            Don't have an account?

            <a href="signup.html">

                Create Account

            </a>

        </div>

        <footer>

            Version 1.0

        </footer>

    </div>

    <script type="module">

        import { register } from "./firebase.js";

        window.register = async function () {

            const name = document.getElementById("name").value;

            const email = document.getElementById("email").value;

            const password = document.getElementById("password").value;

            const confirm = document.getElementById("confirm").value;

            if (password !== confirm) {

                alert("Passwords do not match.");

                return;

            }

            try {

                await register(name, email, password);

                alert("Account created successfully!");

                window.location.href = "signin.html";

            } catch (error) {

                alert(error.message);

            }

        }

    </script>

</body>

</html>
