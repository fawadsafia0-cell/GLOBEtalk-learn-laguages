<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - GlobeTalk</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #EAD9FF 0%, transparent 40%),
                radial-gradient(circle at bottom right, #FFDDEE 0%, transparent 40%),
                #F9F6FC;

        }

        .card {

            width: 400px;
            max-width: 92%;

            background: white;

            padding: 35px;

            border-radius: 30px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, .12);

        }

        .logo {

            width: 85px;
            height: 85px;

            margin: auto;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #B7A4E0;

            font-size: 40px;

        }

        h1 {

            font-family: 'Baloo 2';

            margin-top: 15px;

            text-align: center;

            color: #7C5CD1;

        }

        p {

            margin: 15px 0 25px;

            text-align: center;

            color: #777;

        }

        label {

            font-weight: 700;

            font-size: 14px;

        }

        input {

            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 15px;

            background: #F4F1FA;

            font-size: 15px;

            outline: none;

        }

        button {

            width: 100%;

            padding: 16px;

            margin-top: 25px;

            border: none;

            border-radius: 16px;

            background: linear-gradient(135deg, #B18AE9, #9C6DFF);

            color: white;

            font-size: 17px;

            font-weight: 800;

            cursor: pointer;

        }

        .back {

            margin-top: 25px;

            text-align: center;

        }

        .back a {

            text-decoration: none;

            font-weight: 700;

            color: #8D6ED7;

        }

        .success {

            display: none;

            margin-top: 20px;

            padding: 12px;

            border-radius: 12px;

            background: #E7FFF1;

            color: #1D8B52;

            text-align: center;

            font-weight: 700;

        }
    </style>

</head>

<body>

    <div class="card">

        <div class="logo">
            🔒
        </div>

        <h1>Forgot Password</h1>

        <p>
            Enter your email address and we'll send you a password reset link.
        </p>

        <label>Email Address</label>

        <input type="email" id="email" placeholder="example@email.com">

        <button onclick="resetPassword()">

            Send Reset Link

        </button>

        <div class="success" id="success">

            Password reset email has been sent.

        </div>

        <div class="back">

            <a href="signin.html">

                ← Back to Sign In

            </a>

        </div>

    </div>

    <script type="module">

        import { resetPassword } from "./firebase.js";

        window.resetPassword = async function () {

            const email = document.getElementById("email").value;

            try {

                await resetPassword(email);

                alert("Password reset email sent.");

            } catch (error) {

                alert(error.message);

            }

        }

    </script>
</body>

</html>
