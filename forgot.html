<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - GlobeTalk</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        .forgot-card{

width:430px;
max-width:94%;

padding:40px;

background:rgba(255,255,255,.82);

backdrop-filter:blur(18px);

border-radius:30px;

box-shadow:0 25px 70px rgba(0,0,0,.12);

}

.logo{

width:90px;
height:90px;

margin:auto;

display:flex;

justify-content:center;

align-items:center;

font-size:45px;

background:linear-gradient(135deg,#8b5cf6,#b18ae9);

border-radius:50%;

color:white;

margin-bottom:20px;

}

h1{

text-align:center;

font-family:'Baloo 2';

font-size:36px;

color:#7b4fe0;

}

.subtitle{

text-align:center;

margin:12px 0 28px;

color:#777;

}

.input-group{

margin-bottom:22px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:700;

}

.input-group input{

width:100%;

padding:15px;

border:none;

outline:none;

background:#f6f2fd;

border-radius:16px;

}

.input-group input:focus{

box-shadow:0 0 0 3px rgba(139,92,246,.25);

}

#resetBtn{

width:100%;

padding:16px;

border:none;

border-radius:18px;

background:linear-gradient(135deg,#8b5cf6,#b18ae9);

color:white;

font-size:17px;

font-weight:800;

cursor:pointer;

transition:.25s;

}

#resetBtn:hover{

transform:translateY(-2px);

box-shadow:0 12px 30px rgba(139,92,246,.35);

}

.back{

margin-top:25px;

text-align:center;

}

.back a{

text-decoration:none;

font-weight:800;

color:#8b5cf6;

}

.loader{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:rgba(255,255,255,.88);

z-index:999;

}

.hidden{

display:none;

}

.spinner{

width:70px;
height:70px;

border:6px solid #eee;

border-top:6px solid #8b5cf6;

border-radius:50%;

animation:spin .8s linear infinite;

margin-bottom:20px;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}
    </style>


</head>

<body>

    <div class="background">

        <div class="blob blob1"></div>
        <div class="blob blob2"></div>

    </div>

    <div class="forgot-card">

        <div class="logo">

            🔐

        </div>

        <h1>Forgot Password</h1>

        <p class="subtitle">

            Enter your email to receive a password reset link.

        </p>

        <form id="forgotForm">

            <div class="input-group">

                <label>Email Address</label>

                <input type="email" id="email" placeholder="Enter your email" required>

            </div>

            <button type="submit" id="resetBtn">

                Send Reset Link

            </button>

            <div class="back">

                <a href="signin.html">

                    ← Back to Sign In

                </a>

            </div>

        </form>

    </div>

    <div id="loader" class="loader hidden">

        <div class="spinner"></div>

        <p>

            Sending reset email...

        </p>

    </div>
    <script type="module">

        import { resetPassword } from "./firebase.js";

        const form = document.getElementById("forgotForm");

        const loader = document.getElementById("loader");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            loader.classList.remove("hidden");

            const email = document.getElementById("email").value;

            try {

                await resetPassword(email);

                loader.classList.add("hidden");

                alert("Password reset email sent successfully!");

                window.location.href = "signin.html";

            } catch (error) {

                loader.classList.add("hidden");

                alert(error.message);

            }

        });

    </script>
    
    </body>

</html>
